<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#183042}.t{font-size:29px;font-weight:700}.s{font-size:14px;fill:#5d7280}.pt{font-size:18px;font-weight:700}.nt{font-size:14px;font-weight:700;text-anchor:middle}.x{font-size:12px;text-anchor:middle;fill:#45606f}.l{font-size:12px;font-weight:600;fill:#45606f}.p{fill:#fbfdfe;stroke:#9aabb5;stroke-width:1.7;rx:16}.d{fill:#fff0f4;stroke:#bd5877;stroke-width:2;rx:9}.b{fill:#f1edff;stroke:#7057b4;stroke-width:2;rx:9}.c{fill:#edf6ff;stroke:#3d7fb1;stroke-width:2;rx:9}.g{fill:#eef8f6;stroke:#238a7f;stroke-width:2;rx:9}.o{fill:#fff;stroke:#667d89;stroke-width:1.5;rx:8}.y{fill:#eaf8ef;stroke:#31855a;stroke-width:2;rx:9}.sum{fill:#fff7e8;stroke:#c98218;stroke-width:2}.a{fill:none;stroke:#425466;stroke-width:1.9;marker-end:url(#a)}.da{fill:none;stroke:#bd5877;stroke-width:1.9;marker-end:url(#a)}.ba{fill:none;stroke:#7057b4;stroke-width:1.9;marker-end:url(#a)}.r{fill:none;stroke:#80929d;stroke-width:1.6;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs>
<text x="35" y="42" class="t">CMEM：Cross-Mamba Enhancement Module</text><text x="35" y="68" class="s">依据当前 CMEM.py · 默认 dim=64，share_mamba=False，use_checkpoint=True</text>
<g id="overview"><rect x="25" y="88" width="1550" height="350" class="p"/><text x="45" y="118" class="pt">A. CMEM 总体结构</text>
<rect x="45" y="155" width="125" height="55" class="d"/><text x="107" y="179" class="nt">细节特征 D</text><text x="107" y="198" class="x">B×C×H×W</text><rect x="45" y="330" width="125" height="55" class="b"/><text x="107" y="354" class="nt">基础特征 B</text><text x="107" y="373" class="x">B×C×H×W</text>
<text x="210" y="146" class="l">局部上下文分支</text><rect x="205" y="160" width="90" height="45" class="o"/><text x="250" y="187" class="nt">BN(D)</text><rect x="205" y="220" width="90" height="45" class="o"/><text x="250" y="247" class="nt">BN(B)</text><rect x="330" y="185" width="100" height="55" class="o"/><text x="380" y="209" class="nt">Concat</text><text x="380" y="229" class="x">2C</text><rect x="465" y="185" width="110" height="55" class="g"/><text x="520" y="209" class="nt">1×1 Conv</text><text x="520" y="229" class="x">2C→C</text><rect x="610" y="168" width="185" height="88" class="g"/><text x="702" y="194" class="nt">BaseFeatureExtraction</text><text x="702" y="218" class="x">LN→Attention + residual</text><text x="702" y="239" class="x">LN→MLP + residual</text><rect x="830" y="185" width="100" height="55" class="o"/><text x="880" y="209" class="nt">LayerNorm</text><text x="880" y="229" class="x">X</text>
<text x="210" y="303" class="l">全局交叉建模分支</text><rect x="205" y="313" width="90" height="45" class="o"/><text x="250" y="340" class="nt">LN(D)</text><rect x="205" y="370" width="90" height="45" class="o"/><text x="250" y="397" class="nt">LN(B)</text><rect x="350" y="305" width="350" height="108" class="c"/><text x="525" y="333" class="nt">CrossSpatialMamba4Path</text><text x="525" y="357" class="x">水平正/反向 + 垂直正/反向</text><text x="525" y="379" class="x">4 × 独立 CrossMambaSeqBlock</text><text x="525" y="401" class="x">复原 → 四路平均 → 1×1 Conv</text><rect x="740" y="330" width="120" height="58" class="c"/><text x="800" y="355" class="nt">Merge Conv</text><text x="800" y="376" class="x">1×1, C→C</text>
<circle cx="1050" cy="270" r="27" class="sum"/><text x="1050" y="278" class="nt" style="font-size:23px">Σ</text><text x="1050" y="311" class="l" text-anchor="middle">X + Cross + D + B</text><rect x="1155" y="233" width="190" height="74" class="y"/><text x="1250" y="261" class="nt">增强融合特征 F</text><text x="1250" y="285" class="x">F = X + Cross + D + B</text>
