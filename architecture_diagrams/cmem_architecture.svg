<rect x="1390" y="160" width="155" height="120" fill="#f8fafb" stroke="#a7b4bc" rx="9"/><text x="1467" y="186" class="nt">说明</text><text x="1405" y="214" class="s">绿色：局部分支</text><text x="1405" y="238" class="s">蓝色：Mamba 分支</text><text x="1405" y="262" class="s">虚线：输入残差</text></g>
<g id="fourpath"><rect x="25" y="460" width="800" height="415" class="p"/><text x="45" y="490" class="pt">B. CrossSpatialMamba4Path</text>
<rect x="50" y="535" width="115" height="50" class="d"/><text x="107" y="566" class="nt">LN(D)</text><rect x="50" y="610" width="115" height="50" class="b"/><text x="107" y="641" class="nt">LN(B)</text><rect x="200" y="555" width="120" height="85" class="o"/><text x="260" y="581" class="nt">序列化</text><text x="260" y="604" class="x">H：逐行展开</text><text x="260" y="625" class="x">V：转置展开</text>
<rect x="365" y="515" width="235" height="58" class="c"/><text x="482" y="539" class="nt">水平正向 H→</text><text x="482" y="559" class="x">CrossMamba Block #1</text><rect x="365" y="585" width="235" height="58" class="c"/><text x="482" y="609" class="nt">水平反向 H←</text><text x="482" y="629" class="x">flip · Block #2 · flip back</text><rect x="365" y="655" width="235" height="58" class="c"/><text x="482" y="679" class="nt">垂直正向 V↓</text><text x="482" y="699" class="x">CrossMamba Block #3</text><rect x="365" y="725" width="235" height="58" class="c"/><text x="482" y="749" class="nt">垂直反向 V↑</text><text x="482" y="769" class="x">flip · Block #4 · flip back</text>
<rect x="650" y="585" width="140" height="90" class="o"/><text x="720" y="612" class="nt">恢复空间布局</text><text x="720" y="636" class="x">4× B×C×H×W</text><text x="720" y="658" class="x">四路平均</text><circle cx="720" cy="745" r="27" class="sum"/><text x="720" y="751" class="nt">平均</text><rect x="650" y="805" width="140" height="45" class="c"/><text x="720" y="832" class="nt">1×1 Conv</text>
<path d="M165 560H200M165 635H200M320 575H345V544H365M320 590H345V614H365M320 605H345V684H365M320 620H345V754H365M600 544H625V602H650M600 614H650M600 684H625V650H650M600 754H625V665H650M720 675V718M720 772V805" class="a"/><text x="50" y="825" class="s">默认 share_mamba=False：四个方向使用四组独立参数</text><text x="50" y="850" class="s">True 时：沿 batch 维拼接四路，共用一个 Block</text></g>
<g id="block"><rect x="845" y="460" width="730" height="415" class="p"/><text x="865" y="490" class="pt">C. CrossMambaSeqBlock：交叉门控 SSM</text>
<rect x="870" y="545" width="110" height="50" class="d"/><text x="925" y="567" class="nt">D 序列</text><text x="925" y="585" class="x">B×L×C</text><rect x="870" y="645" width="110" height="50" class="b"/><text x="925" y="667" class="nt">B 序列</text><text x="925" y="685" class="x">B×L×C</text>
<rect x="1020" y="535" width="145" height="70" class="c"/><text x="1092" y="561" class="nt">Linear D</text><text x="1092" y="582" class="x">x_D, z_D</text><rect x="1020" y="635" width="145" height="70" class="c"/><text x="1092" y="661" class="nt">Linear B</text><text x="1092" y="682" class="x">x_B, z_B</text>
<rect x="1205" y="535" width="320" height="70" class="g"/><text x="1365" y="559" class="nt">D 路 Selective Scan</text><text x="1365" y="580" class="x">DW Conv1D + SiLU；x_D→Δ_D,B_D,C_D；gate=z_B</text><rect x="1205" y="635" width="320" height="70" class="g"/><text x="1365" y="659" class="nt">B 路 Selective Scan</text><text x="1365" y="680" class="x">DW Conv1D + SiLU；x_B→Δ_B,B_B,C_B；gate=z_D</text>
<rect x="1040" y="750" width="120" height="50" class="o"/><text x="1100" y="780" class="nt">LN(Y_D)</text><rect x="1370" y="750" width="120" height="50" class="o"/><text x="1430" y="780" class="nt">LN(Y_B)</text><circle cx="1265" cy="775" r="26" class="sum"/><text x="1265" y="782" class="nt" style="font-size:22px">+</text><rect x="1200" y="825" width="130" height="45" class="c"/><text x="1265" y="852" class="nt">Output Linear</text>
