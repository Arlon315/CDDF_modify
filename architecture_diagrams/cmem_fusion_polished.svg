<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1120" viewBox="0 0 1920 1120">
  <defs>
    <style>
      .title { font: 700 34px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#12334A; }
      .subtitle { font: 400 17px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#587184; }
      .cap { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#17425B; }
      .label { font: 600 16px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#12334A; }
      .small { font: 400 14px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#577183; }
      .white { font: 600 16px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#FFFFFF; }
      .whiteSmall { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#DDEDF4; }
      .arrow { fill:none; stroke:#2B718E; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .signal { fill:none; stroke:#9B5E78; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#gateArrow); }
      .dash { fill:#F8FCFD; stroke:#91B6C8; stroke-width:2; stroke-dasharray:8 7; }
      .node { fill:#FFFFFF; stroke:#80ADBF; stroke-width:2; }
    </style>
    <linearGradient id="ir" x1="0" x2="1"><stop stop-color="#155D7C"/><stop offset="1" stop-color="#1B7591"/></linearGradient>
    <linearGradient id="vis" x1="0" x2="1"><stop stop-color="#207D98"/><stop offset="1" stop-color="#3A98AA"/></linearGradient>
    <linearGradient id="common" x1="0" x2="1"><stop stop-color="#365F88"/><stop offset="1" stop-color="#527DA8"/></linearGradient>
    <linearGradient id="private" x1="0" x2="1"><stop stop-color="#8C4D69"/><stop offset="1" stop-color="#B2667E"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#184D66" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 z" fill="#2B718E"/></marker>
    <marker id="gateArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#9B5E78"/></marker>
  </defs>

  <rect width="1920" height="1120" fill="#FBFDFE"/>
  <rect x="40" y="30" width="1840" height="96" rx="18" fill="#EEF7FA"/>
  <text x="82" y="80" class="title">CMEM：跨模态 Mamba 增强与融合模块</text>
  <text x="82" y="108" class="subtitle">公共跨模态信息建模 + 模态私有自适应卷积增强</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="90" y="170" width="190" height="66" rx="12" fill="url(#ir)"/>
    <text x="185" y="198" class="white" text-anchor="middle">红外增强特征</text><text x="185" y="219" class="whiteSmall" text-anchor="middle">E_IR · B×64×H×W</text>
    <rect x="1640" y="170" width="190" height="66" rx="12" fill="url(#vis)"/>
    <text x="1735" y="198" class="white" text-anchor="middle">可见光增强特征</text><text x="1735" y="219" class="whiteSmall" text-anchor="middle">E_VIS · B×64×H×W</text>
  </g>

  <!-- private panels -->
  <rect x="55" y="270" width="270" height="535" rx="20" class="dash"/>
  <text x="190" y="309" class="cap" text-anchor="middle">IR 私有信息建模</text>
  <rect x="100" y="348" width="180" height="80" rx="12" fill="url(#private)"/>
  <text x="190" y="381" class="white" text-anchor="middle">AKCBlock</text><text x="190" y="405" class="whiteSmall" text-anchor="middle">9-point AKConv</text>
  <rect x="100" y="487" width="180" height="62" rx="10" class="node"/>
  <text x="190" y="514" class="label" text-anchor="middle">1×1 Conv → 1×1 Conv</text><text x="190" y="536" class="small" text-anchor="middle">局部通道混合</text>
  <rect x="100" y="610" width="180" height="70" rx="10" fill="#F8EDEF" stroke="#B2667E" stroke-width="2"/>
  <text x="190" y="641" class="label" text-anchor="middle">私有特征 P_IR</text><text x="190" y="663" class="small" text-anchor="middle">含输入残差</text>
  <path d="M185 236 V348" class="arrow"/><path d="M190 428 V487" class="arrow"/><path d="M190 549 V610" class="arrow"/>

  <rect x="1595" y="270" width="270" height="535" rx="20" class="dash"/>
  <text x="1730" y="309" class="cap" text-anchor="middle">VIS 私有信息建模</text>
  <rect x="1640" y="348" width="180" height="80" rx="12" fill="url(#private)"/>
  <text x="1730" y="381" class="white" text-anchor="middle">AKCBlock</text><text x="1730" y="405" class="whiteSmall" text-anchor="middle">9-point AKConv</text>
  <rect x="1640" y="487" width="180" height="62" rx="10" class="node"/>
  <text x="1730" y="514" class="label" text-anchor="middle">1×1 Conv → 1×1 Conv</text><text x="1730" y="536" class="small" text-anchor="middle">局部通道混合</text>
  <rect x="1640" y="610" width="180" height="70" rx="10" fill="#F8EDEF" stroke="#B2667E" stroke-width="2"/>
  <text x="1730" y="641" class="label" text-anchor="middle">私有特征 P_VIS</text><text x="1730" y="663" class="small" text-anchor="middle">含输入残差</text>
  <path d="M1735 236 V348" class="arrow"/><path d="M1730 428 V487" class="arrow"/><path d="M1730 549 V610" class="arrow"/>

  <!-- common cross mamba -->
  <rect x="375" y="155" width="1170" height="670" rx="22" class="dash"/>
  <rect x="778" y="132" width="365" height="44" rx="22" fill="#DDECF5"/>
  <text x="960" y="161" class="cap" text-anchor="middle">共享跨模态信息建模</text>
  <text x="425" y="212" class="small">四个空间方向：H→、H←、V↓、V↑；默认各方向使用独立参数</text>

  <!-- branch cards -->
  <rect x="450" y="270" width="320" height="450" rx="18" fill="#F6FBFD" stroke="#93BACB" stroke-width="2"/>
  <rect x="1150" y="270" width="320" height="450" rx="18" fill="#F6FBFD" stroke="#93BACB" stroke-width="2"/>
  <rect x="520" y="294" width="180" height="45" rx="10" fill="url(#ir)"/>
  <text x="610" y="323" class="white" text-anchor="middle">IR 序列分支</text>
  <rect x="1220" y="294" width="180" height="45" rx="10" fill="url(#vis)"/>
  <text x="1310" y="323" class="white" text-anchor="middle">VIS 序列分支</text>
  <rect x="510" y="374" width="200" height="48" rx="8" class="node"/><text x="610" y="405" class="label" text-anchor="middle">LayerNorm → Linear</text>
  <rect x="510" y="455" width="200" height="60" rx="8" class="node"/><text x="610" y="483" class="label" text-anchor="middle">DW Conv1D + SiLU</text><text x="610" y="505" class="small" text-anchor="middle">生成 Δ, B, C 参数</text>
  <rect x="510" y="555" width="200" height="65" rx="8" fill="url(#common)"/><text x="610" y="584" class="white" text-anchor="middle">Selective SSM</text><text x="610" y="606" class="whiteSmall" text-anchor="middle">IR context</text>
  <rect x="510" y="656" width="200" height="40" rx="8" class="node"/><text x="610" y="682" class="label" text-anchor="middle">LN → Output Linear</text>
  <path d="M610 339 V374" class="arrow"/><path d="M610 422 V455" class="arrow"/><path d="M610 515 V555" class="arrow"/><path d="M610 620 V656" class="arrow"/>
  <rect x="1210" y="374" width="200" height="48" rx="8" class="node"/><text x="1310" y="405" class="label" text-anchor="middle">LayerNorm → Linear</text>
  <rect x="1210" y="455" width="200" height="60" rx="8" class="node"/><text x="1310" y="483" class="label" text-anchor="middle">DW Conv1D + SiLU</text><text x="1310" y="505" class="small" text-anchor="middle">生成 Δ, B, C 参数</text>
  <rect x="1210" y="555" width="200" height="65" rx="8" fill="url(#common)"/><text x="1310" y="584" class="white" text-anchor="middle">Selective SSM</text><text x="1310" y="606" class="whiteSmall" text-anchor="middle">VIS context</text>
  <rect x="1210" y="656" width="200" height="40" rx="8" class="node"/><text x="1310" y="682" class="label" text-anchor="middle">LN → Output Linear</text>
  <path d="M1310 339 V374" class="arrow"/><path d="M1310 422 V455" class="arrow"/><path d="M1310 515 V555" class="arrow"/><path d="M1310 620 V656" class="arrow"/>

  <!-- common z gate -->
  <rect x="815" y="280" width="290" height="120" rx="16" fill="#E8F0F8" stroke="#6F97BD" stroke-width="2"/>
  <text x="960" y="315" class="cap" text-anchor="middle">公共门控 Z</text>
  <text x="960" y="345" class="label" text-anchor="middle">I + V + I ⊙ V</text>
  <text x="960" y="372" class="small" text-anchor="middle">LayerNorm → Linear → z_common</text>
  <path d="M280 203 H420 V247 H815" class="arrow"/><path d="M1640 203 H1500 V247 H1105" class="arrow"/>
  <path d="M815 340 H770 V585 H710" class="signal"/><path d="M1105 340 H1150 V585 H1210" class="signal"/>
  <text x="779" y="569" class="small" fill="#8C4D69">gate</text><text x="1120" y="569" class="small" fill="#8C4D69">gate</text>

  <!-- merge -->
  <text x="960" y="880" class="cap" text-anchor="middle">跨模态融合输出</text>
  <rect x="470" y="900" width="220" height="64" rx="12" fill="#E9F5F8" stroke="#6FAEC4" stroke-width="2"/>
  <text x="580" y="928" class="label" text-anchor="middle">I_enhanced</text><text x="580" y="950" class="small" text-anchor="middle">C_IR + P_IR</text>
  <rect x="1230" y="900" width="220" height="64" rx="12" fill="#E9F5F8" stroke="#6FAEC4" stroke-width="2"/>
  <text x="1340" y="928" class="label" text-anchor="middle">V_enhanced</text><text x="1340" y="950" class="small" text-anchor="middle">C_VIS + P_VIS</text>
  <circle cx="960" cy="932" r="31" fill="#2B7E9D"/><text x="960" y="942" class="white" text-anchor="middle" font-size="27">C</text>
  <rect x="850" y="1005" width="220" height="58" rx="12" fill="url(#common)"/>
  <text x="960" y="1031" class="white" text-anchor="middle">1×1 Conv · 128→64</text><text x="960" y="1050" class="whiteSmall" text-anchor="middle">Fused Feature F_E</text>
  <path d="M610 696 V820 H580 V900" class="arrow"/><path d="M190 680 V850 H580 V900" class="arrow"/>
  <path d="M1310 696 V820 H1340 V900" class="arrow"/><path d="M1730 680 V850 H1340 V900" class="arrow"/>
  <path d="M690 932 H929" class="arrow"/><path d="M1230 932 H991" class="arrow"/><path d="M960 963 V1005" class="arrow"/>

  <!-- legend -->
  <rect x="70" y="1076" width="1780" height="24" rx="10" fill="#EEF7FA"/>
  <text x="960" y="1094" class="small" text-anchor="middle">蓝色：跨模态全局建模　　酒红色：模态私有局部建模　　粉色连线：公共门控 Z　　C：通道拼接（Concat）</text>
</svg>
