<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .title { font: 700 34px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#12334A; }
      .subtitle { font: 400 17px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#5A7182; }
      .section { font: 700 19px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#17425B; }
      .label { font: 600 17px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#12334A; }
      .small { font: 400 14px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#567083; }
      .nodeText { font: 600 16px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#FFFFFF; }
      .nodeSub { font: 400 13px 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#DCEEF5; }
      .arrow { fill:none; stroke:#2B718E; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .thinArrow { fill:none; stroke:#6090A6; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowSmall); }
      .dash { fill:#F7FBFD; stroke:#91B6C8; stroke-width:2; stroke-dasharray:8 7; }
      .panel { fill:#FFFFFF; stroke:#B6D0DC; stroke-width:2; }
    </style>
    <linearGradient id="navy" x1="0" x2="1"><stop stop-color="#155D7C"/><stop offset="1" stop-color="#1B7591"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#1C7795"/><stop offset="1" stop-color="#2C91A7"/></linearGradient>
    <linearGradient id="fusion" x1="0" x2="1"><stop stop-color="#255E85"/><stop offset="1" stop-color="#327DA4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#184D66" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 z" fill="#2B718E"/></marker>
    <marker id="arrowSmall" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6090A6"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="#FBFDFE"/>
  <rect x="40" y="30" width="1840" height="92" rx="18" fill="#EEF7FA"/>
  <text x="86" y="78" class="title">频率解耦双分支红外–可见光图像融合网络</text>
  <text x="86" y="106" class="subtitle">Frequency-Decoupled Dual-Branch Infrared–Visible Image Fusion Network</text>
  <rect x="1520" y="55" width="292" height="42" rx="21" fill="#D7EDF3"/>
  <text x="1666" y="82" class="label" text-anchor="middle">所有特征：B × 64 × H × W</text>

  <!-- inputs -->
  <text x="80" y="202" class="section">输入模态</text>
  <g filter="url(#shadow)">
    <rect x="70" y="250" width="155" height="120" rx="14" fill="url(#navy)"/>
    <text x="147" y="298" class="nodeText" text-anchor="middle">红外图像</text>
    <text x="147" y="326" class="nodeSub" text-anchor="middle">IR · 1×H×W</text>
    <rect x="70" y="650" width="155" height="120" rx="14" fill="url(#blue)"/>
    <text x="147" y="698" class="nodeText" text-anchor="middle">可见光图像</text>
    <text x="147" y="726" class="nodeSub" text-anchor="middle">VIS · 1×H×W</text>
  </g>

  <!-- shared encoder frame -->
  <rect x="275" y="165" width="710" height="690" rx="20" class="dash"/>
  <rect x="315" y="143" width="202" height="42" rx="21" fill="#DDF0F5"/>
  <text x="416" y="171" class="label" text-anchor="middle">共享权重编码器</text>
  <text x="299" y="218" class="small">同一组参数分别编码 IR 与 VIS</text>

  <!-- Encoder top -->
  <rect x="310" y="247" width="620" height="230" rx="16" class="panel"/>
  <rect x="335" y="274" width="120" height="174" rx="12" fill="url(#navy)"/>
  <text x="395" y="337" class="nodeText" text-anchor="middle">Patch</text><text x="395" y="362" class="nodeText" text-anchor="middle">Embed</text>
  <text x="395" y="394" class="nodeSub" text-anchor="middle">3×3 · 1→64</text>
  <rect x="482" y="274" width="120" height="174" rx="12" fill="url(#navy)"/>
  <text x="542" y="334" class="nodeText" text-anchor="middle">Restormer</text><text x="542" y="360" class="nodeText" text-anchor="middle">Block ×4</text>
  <text x="542" y="394" class="nodeSub" text-anchor="middle">8 heads</text>
  <text x="640" y="282" class="label">FFE · 频率解耦特征提取</text>
  <rect x="632" y="300" width="270" height="61" rx="10" fill="#E7F4F8" stroke="#94C6D6"/>
  <text x="650" y="326" class="label">细节 / 高频分支</text>
  <rect x="760" y="311" width="74" height="31" rx="6" fill="#2B7E9D"/>
  <text x="797" y="333" class="nodeText" text-anchor="middle" font-size="12">AKDEConv</text>
  <rect x="844" y="311" width="42" height="31" rx="6" fill="#2B7E9D"/>
  <text x="865" y="333" class="nodeText" text-anchor="middle" font-size="12">CGA</text>
  <rect x="632" y="377" width="270" height="52" rx="10" fill="#F1F7FB" stroke="#94C6D6"/>
  <text x="650" y="408" class="label">基础 / 低频分支</text>
  <rect x="760" y="389" width="126" height="29" rx="6" fill="#377EAA"/>
  <text x="823" y="409" class="nodeText" text-anchor="middle" font-size="12">Spatial Mamba 4-Path</text>
  <path d="M225 310 H335" class="arrow"/><path d="M455 360 H482" class="arrow"/><path d="M602 360 H632" class="arrow"/>
  <path d="M707 330 H760" class="thinArrow"/><path d="M834 326 H844" class="thinArrow"/><path d="M707 403 H760" class="thinArrow"/>

  <!-- Encoder lower -->
  <rect x="310" y="545" width="620" height="230" rx="16" class="panel"/>
  <rect x="335" y="572" width="120" height="174" rx="12" fill="url(#blue)"/>
  <text x="395" y="635" class="nodeText" text-anchor="middle">Patch</text><text x="395" y="660" class="nodeText" text-anchor="middle">Embed</text>
  <text x="395" y="692" class="nodeSub" text-anchor="middle">3×3 · 1→64</text>
  <rect x="482" y="572" width="120" height="174" rx="12" fill="url(#blue)"/>
  <text x="542" y="632" class="nodeText" text-anchor="middle">Restormer</text><text x="542" y="658" class="nodeText" text-anchor="middle">Block ×4</text>
  <text x="542" y="692" class="nodeSub" text-anchor="middle">8 heads</text>
  <text x="640" y="580" class="label">FFE · 频率解耦特征提取</text>
  <rect x="632" y="598" width="270" height="61" rx="10" fill="#E7F4F8" stroke="#94C6D6"/>
  <text x="650" y="624" class="label">细节 / 高频分支</text>
  <rect x="760" y="609" width="74" height="31" rx="6" fill="#2B7E9D"/>
  <text x="797" y="631" class="nodeText" text-anchor="middle" font-size="12">AKDEConv</text>
  <rect x="844" y="609" width="42" height="31" rx="6" fill="#2B7E9D"/>
  <text x="865" y="631" class="nodeText" text-anchor="middle" font-size="12">CGA</text>
  <rect x="632" y="675" width="270" height="52" rx="10" fill="#F1F7FB" stroke="#94C6D6"/>
  <text x="650" y="706" class="label">基础 / 低频分支</text>
  <rect x="760" y="687" width="126" height="29" rx="6" fill="#377EAA"/>
  <text x="823" y="707" class="nodeText" text-anchor="middle" font-size="12">Spatial Mamba 4-Path</text>
  <path d="M225 710 H335" class="arrow"/><path d="M455 660 H482" class="arrow"/><path d="M602 660 H632" class="arrow"/>
  <path d="M707 628 H760" class="thinArrow"/><path d="M834 624 H844" class="thinArrow"/><path d="M707 701 H760" class="thinArrow"/>

  <!-- Intra-modal merger -->
  <text x="1025" y="202" class="section">模态内基础–细节融合</text>
  <g filter="url(#shadow)">
    <rect x="1015" y="285" width="190" height="155" rx="18" fill="#FFFFFF" stroke="#79AFC4" stroke-width="2"/>
    <circle cx="1060" cy="337" r="22" fill="#2B7E9D"/><text x="1060" y="344" class="nodeText" text-anchor="middle" font-size="24">⊕</text>
    <rect x="1096" y="313" width="82" height="48" rx="8" fill="url(#fusion)"/>
    <text x="1137" y="335" class="nodeText" text-anchor="middle" font-size="13">1×1</text><text x="1137" y="352" class="nodeSub" text-anchor="middle" font-size="11">Conv</text>
    <text x="1110" y="407" class="small" text-anchor="middle">IR 基础–细节特征</text>
    <rect x="1015" y="593" width="190" height="155" rx="18" fill="#FFFFFF" stroke="#79AFC4" stroke-width="2"/>
    <circle cx="1060" cy="645" r="22" fill="#2B7E9D"/><text x="1060" y="652" class="nodeText" text-anchor="middle" font-size="24">⊕</text>
    <rect x="1096" y="621" width="82" height="48" rx="8" fill="url(#fusion)"/>
    <text x="1137" y="643" class="nodeText" text-anchor="middle" font-size="13">1×1</text><text x="1137" y="660" class="nodeSub" text-anchor="middle" font-size="11">Conv</text>
    <text x="1110" y="715" class="small" text-anchor="middle">VIS 基础–细节特征</text>
  </g>
  <path d="M902 330 H1038" class="arrow"/><path d="M902 403 H1038" class="arrow"/><path d="M1082 337 H1096" class="arrow"/>
  <path d="M902 628 H1038" class="arrow"/><path d="M902 701 H1038" class="arrow"/><path d="M1082 645 H1096" class="arrow"/>

  <!-- central fusion -->
  <text x="1315" y="202" class="section">跨模态融合</text>
  <g filter="url(#shadow)">
    <rect x="1280" y="305" width="270" height="420" rx="24" fill="url(#fusion)"/>
    <text x="1415" y="377" class="nodeText" text-anchor="middle" font-size="30">CMEM</text>
    <line x1="1331" y1="401" x2="1499" y2="401" stroke="#9FD1E1" stroke-width="1.5"/>
    <text x="1415" y="445" class="nodeText" text-anchor="middle">Cross-Mamba</text>
    <text x="1415" y="472" class="nodeText" text-anchor="middle">四方向共享建模</text>
    <text x="1415" y="520" class="nodeSub" text-anchor="middle">公共信息 + 私有细节</text>
    <text x="1415" y="547" class="nodeSub" text-anchor="middle">H→ · H← · V↓ · V↑</text>
    <rect x="1335" y="590" width="160" height="55" rx="10" fill="#3F88AA"/>
    <text x="1415" y="613" class="nodeText" text-anchor="middle" font-size="13">详细结构见</text><text x="1415" y="632" class="nodeText" text-anchor="middle" font-size="13">CMEM 子模块图</text>
  </g>
  <path d="M1178 337 H1235 V390 H1280" class="arrow"/><path d="M1178 645 H1235 V640 H1280" class="arrow"/>

  <!-- decoder and output -->
  <g filter="url(#shadow)">
    <rect x="1630" y="365" width="155" height="300" rx="18" fill="url(#navy)"/>
    <text x="1707" y="478" class="nodeText" text-anchor="middle" font-size="23">HTB</text>
    <text x="1707" y="510" class="nodeText" text-anchor="middle" font-size="23">Decoder</text>
    <text x="1707" y="546" class="nodeSub" text-anchor="middle">HTB ×4</text>
    <text x="1707" y="573" class="nodeSub" text-anchor="middle">Conv 64→32→1</text>
    <rect x="1815" y="454" width="72" height="122" rx="14" fill="#E4F3F7" stroke="#75AFC6" stroke-width="2"/>
    <text x="1851" y="494" class="label" text-anchor="middle">融合</text><text x="1851" y="521" class="label" text-anchor="middle">图像 F</text>
    <text x="1851" y="549" class="small" text-anchor="middle">Sigmoid</text>
  </g>
  <path d="M1550 515 H1630" class="arrow"/><path d="M1785 515 H1815" class="arrow"/>

  <!-- legend -->
  <rect x="65" y="938" width="1790" height="76" rx="14" fill="#F0F7FA"/>
  <circle cx="105" cy="976" r="9" fill="#1C7795"/><text x="124" y="982" class="small">编码与特征提取</text>
  <circle cx="355" cy="976" r="9" fill="#377EAA"/><text x="374" y="982" class="small">基础 / 全局信息建模</text>
  <circle cx="650" cy="976" r="9" fill="#2B7E9D"/><text x="669" y="982" class="small">细节 / 局部信息建模</text>
  <circle cx="950" cy="976" r="9" fill="#255E85"/><text x="969" y="982" class="small">跨模态融合与重建</text>
  <text x="1330" y="982" class="small">虚线框：共享参数或功能分组　　⊕：拼接 / 融合</text>
</svg>
