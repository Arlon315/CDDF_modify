<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CMEM Cross-Z Mamba Block</title>
  <desc id="desc">A two-branch Cross-Mamba diagram showing Detail and Base streams exchanging z gates.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#24292f"/>
    </marker>
    <marker id="arrow-detail" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#db4b68"/>
    </marker>
    <marker id="arrow-base" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#5b67d8"/>
    </marker>
    <marker id="arrow-gate" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#ff9f1c"/>
    </marker>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#111827" flood-opacity="0.12"/>
    </filter>

    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #0f172a; stroke-width: 10; rx: 36; filter: url(#soft-shadow); }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #111827; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 20px; fill: #64748b; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; fill: #64748b; text-anchor: middle; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 14px; fill: #64748b; text-anchor: middle; }
      .branch-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 26px; font-weight: 800; text-anchor: middle; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 24px; font-style: italic; fill: #172033; text-anchor: middle; }
      .chip-text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.2; rx: 14; }
      .detail-box { fill: #fff2f5; stroke: #db4b68; stroke-width: 2.6; rx: 16; }
      .base-box { fill: #f2f4ff; stroke: #5b67d8; stroke-width: 2.6; rx: 16; }
      .ssm { fill: #2f343b; stroke: #111827; stroke-width: 2.4; rx: 18; }
      .ssm-text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 25px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      .note { fill: #fff8ed; stroke: #f59e0b; stroke-width: 2; rx: 18; }
      .note-text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #9a5a00; text-anchor: middle; }
      .line { fill: none; stroke: #24292f; stroke-width: 5; marker-end: url(#arrow-dark); }
      .line-thin { fill: none; stroke: #334155; stroke-width: 3.6; marker-end: url(#arrow-dark); }
      .detail-line { fill: none; stroke: #db4b68; stroke-width: 4.4; marker-end: url(#arrow-detail); }
      .base-line { fill: none; stroke: #5b67d8; stroke-width: 4.4; marker-end: url(#arrow-base); }
      .gate-line { fill: none; stroke: #ff9f1c; stroke-width: 5; stroke-dasharray: 12 10; marker-end: url(#arrow-gate); }
      .gate-line-soft { fill: none; stroke: #ff9f1c; stroke-width: 3.2; stroke-dasharray: 8 8; marker-end: url(#arrow-gate); }
      .split-line { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 7; }
      .token-stroke { stroke: #4b5563; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="title" x="960" y="74" text-anchor="middle">CMEM Cross-Z Mamba Block</text>
  <text class="subtitle" x="960" y="109" text-anchor="middle">双分支建模 Detail / Base，并交换门控 z：Detail 用 z_B，Base 用 z_D</text>

  <rect class="panel" x="110" y="145" width="1700" height="840"/>

  <g id="inputs">
    <rect x="375" y="182" width="250" height="54" class="detail-box"/>
    <text class="branch-title" x="500" y="217" fill="#db4b68">Detail 输入 D</text>
    <rect x="1295" y="182" width="250" height="54" class="base-box"/>
    <text class="branch-title" x="1420" y="217" fill="#5b67d8">Base 输入 B</text>

    <g transform="translate(410 250)">
      <rect class="token-stroke" x="0" y="0" width="34" height="30" fill="#ffccd6"/>
      <rect class="token-stroke" x="34" y="0" width="34" height="30" fill="#ff8fa3"/>
      <rect class="token-stroke" x="68" y="0" width="34" height="30" fill="#fff2f5"/>
      <rect class="token-stroke" x="102" y="0" width="34" height="30" fill="#ff6680"/>
      <rect class="token-stroke" x="136" y="0" width="34" height="30" fill="#ffd6df"/>
      <rect class="token-stroke" x="170" y="0" width="34" height="30" fill="#ff8fa3"/>
    </g>
    <g transform="translate(1330 250)">
      <rect class="token-stroke" x="0" y="0" width="34" height="30" fill="#dfe4ff"/>
      <rect class="token-stroke" x="34" y="0" width="34" height="30" fill="#96a1ff"/>
      <rect class="token-stroke" x="68" y="0" width="34" height="30" fill="#f2f4ff"/>
      <rect class="token-stroke" x="102" y="0" width="34" height="30" fill="#6f79e9"/>
      <rect class="token-stroke" x="136" y="0" width="34" height="30" fill="#cbd2ff"/>
      <rect class="token-stroke" x="170" y="0" width="34" height="30" fill="#96a1ff"/>
    </g>
  </g>

  <g id="detail-branch">
    <path class="detail-line" d="M500 282 V330"/>
    <rect x="390" y="330" width="220" height="78" class="detail-box"/>
    <text class="label" x="500" y="361">Projection D</text>
    <text class="small" x="500" y="388">Linear -> x_D, z_D</text>

    <path class="split-line" d="M500 408 V444"/>
    <path class="detail-line" d="M500 428 C430 428 390 455 390 490"/>
    <path class="detail-line" d="M500 428 C570 428 650 455 650 490"/>

    <rect x="288" y="490" width="204" height="62" class="detail-box"/>
    <text class="math" x="390" y="529">x_D</text>
    <rect x="560" y="490" width="180" height="62" class="note"/>
    <text class="math" x="650" y="529">z_D</text>

    <path class="detail-line" d="M390 552 V592"/>
    <rect x="284" y="592" width="212" height="64" class="box"/>
    <text class="label" x="390" y="632">DW Conv1D</text>

    <path class="detail-line" d="M390 656 V696"/>
    <circle cx="390" cy="724" r="33" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
    <text class="label" x="390" y="732">SiLU</text>

    <path class="detail-line" d="M390 757 V795"/>
    <rect x="270" y="795" width="240" height="104" class="ssm"/>
    <text class="ssm-text" x="390" y="837">Selective</text>
    <text class="ssm-text" x="390" y="872">SSM D</text>
  </g>

  <g id="base-branch">
    <path class="base-line" d="M1420 282 V330"/>
    <rect x="1310" y="330" width="220" height="78" class="base-box"/>
    <text class="label" x="1420" y="361">Projection B</text>
    <text class="small" x="1420" y="388">Linear -> x_B, z_B</text>

    <path class="split-line" d="M1420 408 V444"/>
    <path class="base-line" d="M1420 428 C1350 428 1270 455 1270 490"/>
    <path class="base-line" d="M1420 428 C1490 428 1530 455 1530 490"/>

    <rect x="1178" y="490" width="184" height="62" class="base-box"/>
    <text class="math" x="1270" y="529">x_B</text>
    <rect x="1438" y="490" width="184" height="62" class="note"/>
    <text class="math" x="1530" y="529">z_B</text>

    <path class="base-line" d="M1270 552 V592"/>
    <rect x="1164" y="592" width="212" height="64" class="box"/>
    <text class="label" x="1270" y="632">DW Conv1D</text>

    <path class="base-line" d="M1270 656 V696"/>
    <circle cx="1270" cy="724" r="33" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
    <text class="label" x="1270" y="732">SiLU</text>

    <path class="base-line" d="M1270 757 V795"/>
    <rect x="1150" y="795" width="240" height="104" class="ssm"/>
    <text class="ssm-text" x="1270" y="837">Selective</text>
    <text class="ssm-text" x="1270" y="872">SSM B</text>
  </g>

  <g id="z-exchange">
    <rect x="790" y="472" width="340" height="88" class="note"/>
    <text class="note-text" x="960" y="508">核心创新：交换门控 Z</text>
    <text class="tiny" x="960" y="535">z_D 控制 Base 分支，z_B 控制 Detail 分支</text>

    <path class="gate-line" d="M1530 552 C1530 646 1200 690 520 822"/>
    <text class="note-text" x="1022" y="686">z_B -> gate_D</text>

    <path class="gate-line" d="M650 552 C650 646 918 690 1140 822"/>
    <text class="note-text" x="890" y="622">z_D -> gate_B</text>

    <path class="gate-line-soft" d="M522 846 H270"/>
    <text class="tiny" x="232" y="852">gate = z_B</text>
    <path class="gate-line-soft" d="M1138 846 H1390"/>
    <text class="tiny" x="1432" y="852">gate = z_D</text>
  </g>

  <g id="merge">
    <path class="line-thin" d="M390 899 V928 C390 956 505 956 575 956"/>
    <path class="line-thin" d="M1270 899 V928 C1270 956 1155 956 1085 956"/>

    <circle cx="830" cy="956" r="42" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <text class="label" x="830" y="965">+</text>

    <path class="line-thin" d="M575 956 H788"/>
    <path class="line-thin" d="M1085 956 H872"/>

    <rect x="905" y="918" width="210" height="76" class="box"/>
    <text class="label" x="1010" y="950">Output Linear</text>
    <text class="small" x="1010" y="976">C -> C</text>

    <path class="line" d="M872 956 H905"/>
    <path class="line" d="M1115 956 H1268"/>
    <rect x="1268" y="918" width="290" height="76" fill="#ecfeff" stroke="#0891b2" stroke-width="2.6" rx="16"/>
    <text class="label" x="1413" y="950">Cross-enhanced feature</text>
    <text class="small" x="1413" y="976">CMEM 输出</text>
  </g>

  <g id="footer">
    <rect x="190" y="900" width="280" height="54" fill="#fff2f5" stroke="#db4b68" stroke-width="2" rx="18"/>
    <text class="small" x="330" y="933">Detail: x_D + gate z_B</text>

    <rect x="1450" y="900" width="280" height="54" fill="#f2f4ff" stroke="#5b67d8" stroke-width="2" rx="18"/>
    <text class="small" x="1590" y="933">Base: x_B + gate z_D</text>

    <rect x="710" y="185" width="500" height="58" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="18"/>
    <text class="small" x="960" y="220">四方向扫描 H→ / H← / V→ / V← 共用此 Cross-Z Block 逻辑</text>
  </g>
</svg>
